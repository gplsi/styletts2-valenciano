# --- Configuración General ---
log_dir: "Checkpoint_PhonemeBERT"
mixed_precision: "fp16"
data_folder: "corts_valencianes"
test_data_folder: "corts_valencianes_test" 
batch_size: 50
save_interval: 5000
log_interval: 10
num_process: 1
num_steps: 25000

# --- Parámetros del Dataset ---
dataset_params:
    # El único parámetro que usa el DataCollator
    word_mask_prob: 0.15 # (Se usa como mlm_probability)
    tokenizer_name: "javiimts/bert-ca-va-tokenizer"
    
# --- Parámetros del Modelo ---
# (Estos son los únicos que lee el script para construir el BertConfig)
model_params:
    hidden_size: 768
    num_attention_heads: 12
    intermediate_size: 2048
    max_position_embeddings: 512
    num_hidden_layers: 12
    
