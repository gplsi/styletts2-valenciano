log_dir: "checkpoints_valenciano"
mixed_precision: "fp16"
batch_size: 32
num_steps: 50000
log_interval: 100
save_interval: 10000

model_params:
    vocab_size: 178
    hidden_size: 768
    num_attention_heads: 12
    intermediate_size: 2048
    max_position_embeddings: 512
    num_hidden_layers: 12
    dropout: 0.1
